<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Squircle Badge Background -->
  <rect width="64" height="64" rx="16" fill="#FAF8F5" />
  <rect
    x="0.75"
    y="0.75"
    width="62.5"
    height="62.5"
    rx="15.25"
    stroke="#1A3D34"
    stroke-opacity="0.12"
    stroke-width="1.5"
  />

  <!-- Soft Ground Shadows -->
  <ellipse cx="37" cy="49" rx="14" ry="2.2" fill="#1A3D34" fill-opacity="0.12" />
  <ellipse cx="14" cy="42" rx="3.5" ry="1.2" fill="#F97316" fill-opacity="0.18" />

  <!-- Orbiting Shared Route Ring - Back Segment (Behind Car) -->
  <path
    d="M13 39C16 31 46 27 54 35"
    stroke="url(#ring_back_grad)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-opacity="0.4"
  />

  <!-- Destination Map Pin (Left) -->
  <g>
    <path
      d="M14 26C10.7 26 8 28.7 8 32C8 36.2 14 41 14 41C14 41 20 36.2 20 32C20 28.7 17.3 26 14 26Z"
      fill="url(#pin_grad)"
    />
    <circle cx="14" cy="31.8" r="2.2" fill="#FAF8F5" />
  </g>

  <!-- The Front-Facing Co-Rider Car Silhouette -->
  <g>
    <!-- Main Car Body Shell -->
    <path
      d="M26 25C26.8 19.5 30 17 37 17C44 17 47.2 19.5 48 25L49.5 28C52 28.2 53.5 29.5 53.2 31.5C52.9 33.2 51.5 34 49 33.8L49.5 37C50.2 41.5 48.5 45 44 45.5C41 45.8 33 45.8 30 45.5C25.5 45 23.8 41.5 24.5 37L25 33.8C22.5 34 21.1 33.2 20.8 31.5C20.5 29.5 22 28.2 24.5 28L26 25Z"
      fill="#1A3D34"
    />

    <!-- Windshield Cutout Opening -->
    <path
      d="M28 26.5C28.6 21 31.5 19.2 37 19.2C42.5 19.2 45.4 21 46 26.5C46 28 28 28 28 26.5Z"
      fill="#FAF8F5"
    />

    <!-- Two Co-Riders Inside Windshield (Heads & Torsos) -->
    <circle cx="33.2" cy="23.2" r="2.6" fill="#1A3D34" />
    <path d="M30 28C30.2 25.8 36.2 25.8 36.4 28Z" fill="#1A3D34" />

    <circle cx="40.8" cy="23.2" r="2.6" fill="#1A3D34" />
    <path d="M37.6 28C37.8 25.8 43.8 25.8 44 28Z" fill="#1A3D34" />

    <!-- Friendly Oval Headlights -->
    <ellipse
      cx="29"
      cy="36.5"
      rx="3.6"
      ry="2.4"
      transform="rotate(-12 29 36.5)"
      fill="#FAF8F5"
      stroke="#10B981"
      stroke-width="0.8"
    />
    <ellipse
      cx="45"
      cy="36.5"
      rx="3.6"
      ry="2.4"
      transform="rotate(12 45 36.5)"
      fill="#FAF8F5"
      stroke="#10B981"
      stroke-width="0.8"
    />
  </g>

  <!-- Orbiting Shared Route Ring - Front Segment (Sweeping in Front of Car) -->
  <path
    d="M11 40C11 48.5 53 48.5 55 36"
    stroke="url(#ring_front_grad)"
    stroke-width="3.6"
    stroke-linecap="round"
  />

  <!-- Top-Right Motion Excitement Sparks -->
  <path d="M48 13.5L52 7.5" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" />
  <path d="M53.5 17.5L58.5 13" stroke="#FBBF24" stroke-width="2.8" stroke-linecap="round" />

  <!-- Transit Sparkle Stars -->
  <path
    d="M20 13C20 14.8 18.8 16 17 16C18.8 16 20 17.2 20 19C20 17.2 21.2 16 23 16C21.2 16 20 14.8 20 13Z"
    fill="#10B981"
  />
  <path
    d="M56 42C56 43.2 55.2 44 54 44C55.2 44 56 44.8 56 46C56 44.8 56.8 44 58 44C56.8 44 56 43.2 56 42Z"
    fill="#F59E0B"
  />

  <defs>
    <linearGradient id="pin_grad" x1="8" y1="26" x2="20" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB923C" />
      <stop offset="1" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="ring_back_grad" x1="13" y1="39" x2="54" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ring_front_grad" x1="11" y1="40" x2="55" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" />
      <stop offset="0.6" stop-color="#34D399" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
</svg>
